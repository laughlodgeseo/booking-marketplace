# Railway configuration is managed per service in the Railway project.
# This monorepo deploys two separate services from the main branch:
# - api: Dockerfile, HTTP port 10000, /api/health, Prisma migrate deploy before startup
# - web: Dockerfile.web, HTTP port 3000, /
#
# IMPORTANT: Do not put a global [build] or [deploy] block here.
# Those settings are applied to BOTH services by Railway when both point at
# the repository root, overriding their individually configured Dockerfiles
# and healthchecks. This file intentionally has no global overrides.
